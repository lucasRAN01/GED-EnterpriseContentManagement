# GED-ECM — Stack Mayan EDMS 4.12.2 (image officielle mayanedms/mayanedms)
# Réf : docs/00-mapping-TDR.md, docs/02-deploiement.md
# Usage : docker compose up -d | docker compose --profile sso up -d | docker compose --profile stats up -d
name: ged-ecm

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mayan}
      POSTGRES_USER: ${POSTGRES_USER:-mayan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set_in_.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-mayan}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Image officielle : mayanedms/mayanedms (et non mayan-edms). `run_all` lance
  # sous supervisord l'interface web, les workers Celery A-D et beat, comme le
  # docker-compose officiel de Mayan. Montée en charge : voir docs/02-deploiement.md.
  app:
    image: mayanedms/mayanedms:v4.12.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - config/mayan.env
    environment:
      MAYAN_SECRET_KEY: ${MAYAN_SECRET_KEY:?set_in_.env}
      MAYAN_DATABASES: "{'default':{'ENGINE':'django.db.backends.postgresql','NAME':'${POSTGRES_DB:-mayan}','USER':'${POSTGRES_USER:-mayan}','PASSWORD':'${POSTGRES_PASSWORD}','HOST':'postgres'}}"
      MAYAN_CELERY_BROKER_URL: redis://redis:6379/0
      MAYAN_CELERY_RESULT_BACKEND: redis://redis:6379/1
      MAYAN_LOCK_MANAGER_BACKEND: mayan.apps.lock_manager.backends.redis_lock.RedisLock
      MAYAN_LOCK_MANAGER_BACKEND_ARGUMENTS: "{'redis_url':'redis://redis:6379/2'}"
      MAYAN_AUTOADMIN_USERNAME: ${MAYAN_ADMIN_USER:-admin}
      MAYAN_AUTOADMIN_PASSWORD: ${MAYAN_ADMIN_PASSWORD:?set_in_.env}
      MAYAN_AUTOADMIN_EMAIL: ${MAYAN_ADMIN_EMAIL:-admin@meh.mg}
      # Le pack de langue Tesseract français n'est pas dans l'image : installé au démarrage
      MAYAN_APT_INSTALLS: tesseract-ocr-fra
    volumes:
      - mayanmedia:/var/lib/mayan
    healthcheck:
      # ni curl ni wget dans l'image, et gunicorn écoute sur l'IP du conteneur, pas sur localhost
      test: ["CMD", "/opt/mayan-edms/bin/python", "-c", "import socket,urllib.request; urllib.request.urlopen('http://%s:8000/authentication/login/' % socket.gethostbyname(socket.gethostname()), timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # Profil optionnel SSO — Keycloak OIDC pour Mayan
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    restart: unless-stopped
    profiles: ["sso"]
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-keycloak-dev-only-change-me}
    command: ["start-dev"]
    volumes:
      - kcdata:/opt/keycloak/data

  # Profil optionnel stats — Metabase lecture seule sur Postgres
  metabase:
    image: metabase/metabase:v0.50.36
    restart: unless-stopped
    profiles: ["stats"]
    ports:
      - "${METABASE_PORT:-3000}:3000"
    depends_on:
      - postgres
    volumes:
      - metabase:/metabase.db

volumes:
  pgdata:
  redisdata:
  mayanmedia:
  kcdata:
  metabase:
