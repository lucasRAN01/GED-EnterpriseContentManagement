# GED-ECM — Stack Mayan EDMS 4.12.2
# Réf : docs/00-mapping-TDR.md, docs/02-deploiement.md
# Usage : docker compose up -d | docker compose --profile sso up -d | docker compose --profile stats up -d
name: ged-ecm

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mayan}
      POSTGRES_USER: ${POSTGRES_USER:-mayan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set_in_.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-mayan}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: mayanedms/mayan-edms:4.12.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
      - config/mayan.env
    environment:
      MAYAN_DATABASE_URL: postgres://${POSTGRES_USER:-mayan}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mayan}
      MAYAN_REDIS_URL: redis://redis:6379/0
      MAYAN_SECRET_KEY: ${MAYAN_SECRET_KEY:?set_in_.env}
      MAYAN_ADMIN_USERNAME: ${MAYAN_ADMIN_USER:-admin}
      MAYAN_ADMIN_PASSWORD: ${MAYAN_ADMIN_PASSWORD:?set_in_.env}
      MAYAN_ADMIN_EMAIL: ${MAYAN_ADMIN_EMAIL:-admin@meh.mg}
      # OCR français par défaut, workers Celery standards
      MAYAN_OCR_PARSER_TESSERACT_LANGUAGE: ${OCR_LANG:-fra+eng}
    volumes:
      - mayanmedia:/var/lib/mayan
    command: ["run-frontend"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/_health/ || wget -qO- http://localhost:8000/ | grep -qi mayan"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  worker_a:
    image: mayanedms/mayan-edms:4.12.2
    restart: unless-stopped
    depends_on:
      - app
      - redis
      - postgres
    env_file:
      - .env
      - config/mayan.env
    environment:
      MAYAN_DATABASE_URL: postgres://${POSTGRES_USER:-mayan}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mayan}
      MAYAN_REDIS_URL: redis://redis:6379/0
      MAYAN_SECRET_KEY: ${MAYAN_SECRET_KEY:?set_in_.env}
    volumes:
      - mayanmedia:/var/lib/mayan
    command: ["run-worker-a"]

  worker_b:
    image: mayanedms/mayan-edms:4.12.2
    restart: unless-stopped
    depends_on:
      - app
      - redis
    env_file:
      - .env
      - config/mayan.env
    environment:
      MAYAN_DATABASE_URL: postgres://${POSTGRES_USER:-mayan}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mayan}
      MAYAN_REDIS_URL: redis://redis:6379/0
      MAYAN_SECRET_KEY: ${MAYAN_SECRET_KEY:?set_in_.env}
    volumes:
      - mayanmedia:/var/lib/mayan
    command: ["run-worker-b"]

  worker_c:
    image: mayanedms/mayan-edms:4.12.2
    restart: unless-stopped
    depends_on:
      - app
      - redis
    env_file:
      - .env
      - config/mayan.env
    environment:
      MAYAN_DATABASE_URL: postgres://${POSTGRES_USER:-mayan}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mayan}
      MAYAN_REDIS_URL: redis://redis:6379/0
      MAYAN_SECRET_KEY: ${MAYAN_SECRET_KEY:?set_in_.env}
    volumes:
      - mayanmedia:/var/lib/mayan
    command: ["run-worker-c"]

  worker_d:
    image: mayanedms/mayan-edms:4.12.2
    restart: unless-stopped
    depends_on:
      - app
      - redis
    env_file:
      - .env
      - config/mayan.env
    environment:
      MAYAN_DATABASE_URL: postgres://${POSTGRES_USER:-mayan}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mayan}
      MAYAN_REDIS_URL: redis://redis:6379/0
      MAYAN_SECRET_KEY: ${MAYAN_SECRET_KEY:?set_in_.env}
    volumes:
      - mayanmedia:/var/lib/mayan
    command: ["run-worker-d"]

  beat:
    image: mayanedms/mayan-edms:4.12.2
    restart: unless-stopped
    depends_on:
      - app
      - redis
    env_file:
      - .env
      - config/mayan.env
    environment:
      MAYAN_DATABASE_URL: postgres://${POSTGRES_USER:-mayan}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mayan}
      MAYAN_REDIS_URL: redis://redis:6379/0
      MAYAN_SECRET_KEY: ${MAYAN_SECRET_KEY:?set_in_.env}
    volumes:
      - mayanmedia:/var/lib/mayan
    command: ["run-beat"]

  # Profil optionnel SSO — Keycloak OIDC pour Mayan
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    restart: unless-stopped
    profiles: ["sso"]
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set_in_.env_pour_profil_sso}
    command: ["start-dev"]
    volumes:
      - kcdata:/opt/keycloak/data

  # Profil optionnel stats — Metabase lecture seule sur Postgres
  metabase:
    image: metabase/metabase:latest
    restart: unless-stopped
    profiles: ["stats"]
    ports:
      - "${METABASE_PORT:-3000}:3000"
    depends_on:
      - postgres
    volumes:
      - metabase:/metabase.db

volumes:
  pgdata:
  redisdata:
  mayanmedia:
  kcdata:
  metabase:
